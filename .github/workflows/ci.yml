name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint for real errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Byte-compile
        run: python -m compileall -q ai_dirscan.py argus_triage.py argus_console.py

      - name: CLI smoke test
        run: |
          python ai_dirscan.py -h
          python argus_triage.py -h
          python argus_console.py -h
